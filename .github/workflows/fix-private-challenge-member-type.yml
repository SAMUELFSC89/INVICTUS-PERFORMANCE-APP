name: Fix Private Challenge member type

on:
  push:
    branches:
      - feat/site-admin-powerlift-20260918

permissions:
  contents: write

jobs:
  fix-type:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/site-admin-powerlift-20260918
          fetch-depth: 0
      - name: Fix Firestore member inference
        shell: bash
        run: |
          node -e "const fs=require('fs');const p='api/_handlers/private-challenges.ts';let s=fs.readFileSync(p,'utf8');const o='  const members = membersSnap.docs.map(mDoc => mDoc.data());';const n='  const members = membersSnap.docs.map(mDoc => mDoc.data() as { userId: string; userName?: string; userPhoto?: string; points?: number; workoutsCount?: number; [key: string]: unknown });';if(!s.includes(o))process.exit(2);fs.writeFileSync(p,s.replace(o,n));"
          git diff --check
          git add api/_handlers/private-challenges.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: preserve private challenge member fields in IGA settlement"
          git push origin HEAD:feat/site-admin-powerlift-20260918
