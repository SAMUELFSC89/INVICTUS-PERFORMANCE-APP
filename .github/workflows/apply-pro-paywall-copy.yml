name: Apply PRO Paywall Copy
on:
  push:
    branches:
      - feat/pro-paywall-price-cta
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pro-paywall-price-cta
      - name: Update subscription screen
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/SubscriptionManager.tsx')
          s = p.read_text()
          s = s.replace('Insights e recomendações personalizados com base na sua evolução.', 'Chat, análises, memória individual e recomendações personalizadas com base na sua evolução.', 1)
          old = '''{error || currentOfferState?.error ? <div className="subscription-manager-error" role="alert"><span>{error || currentOfferState?.error}</span><button onClick={retry} disabled={!isNative || busy || !hydrated}><RefreshCw />{currentPending ? 'CONFIRMAR NOVAMENTE' : 'TENTAR NOVAMENTE'}</button></div> : null}'''
          new = '''{error && !currentOfferState?.error ? <div className="subscription-manager-error" role="alert"><span>{error}</span><button onClick={retry} disabled={!isNative || busy || !hydrated}><RefreshCw />{currentPending ? 'CONFIRMAR NOVAMENTE' : 'TENTAR NOVAMENTE'}</button></div> : null}\n\n      {!showSuccess && !offer ? <div className="subscription-manager-offer"><span>Invictus Pro</span><b>R$ 29,90</b><small>por mês</small></div> : null}'''
          if old not in s: raise SystemExit('error block anchor not found')
          s = s.replace(old, new, 1)
          old = '''{state === 'purchasing' ? <><Loader2 /> PROCESSANDO NA LOJA…</> : state === 'verifying' ? <><Loader2 /> CONFIRMANDO BENEFÍCIO…</> : currentPending ? 'CONFIRMAR ASSINATURA' : <>ASSINAR {offer ? `· ${offer.priceString}` : ''}</>}'''
          new = '''{state === 'purchasing' ? <><Loader2 /> PROCESSANDO NA LOJA…</> : state === 'verifying' ? <><Loader2 /> CONFIRMANDO BENEFÍCIO…</> : currentPending ? 'CONFIRMAR ASSINATURA' : <>ASSINAR PRO · {offer?.priceString || 'R$ 29,90'}/MÊS</>}'''
          if old not in s: raise SystemExit('purchase CTA anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SubscriptionManager.tsx
          git commit -m "feat: improve PRO subscription price and CTA"
          git push origin HEAD:feat/pro-paywall-price-cta