name: Apply Profile PRO Entry

on:
  push:
    branches:
      - feat/profile-pro-subscription-entry-impl
    paths:
      - scripts/apply-profile-pro-entry.py
      - .github/workflows/apply-profile-pro-entry.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/profile-pro-subscription-entry-impl
          fetch-depth: 0
      - name: Apply implementation
        run: python3 scripts/apply-profile-pro-entry.py
      - name: Remove helper files
        run: |
          rm scripts/apply-profile-pro-entry.py
          rm .github/workflows/apply-profile-pro-entry.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ProfileNew.tsx src/components/SubscriptionManager.tsx src/pages/ProfileSecondary.css src/pages/ProfileNew.css scripts/apply-profile-pro-entry.py .github/workflows/apply-profile-pro-entry.yml
          git commit -m "feat: add PRO subscription entry in profile"
          git push origin HEAD:feat/profile-pro-subscription-entry-impl
