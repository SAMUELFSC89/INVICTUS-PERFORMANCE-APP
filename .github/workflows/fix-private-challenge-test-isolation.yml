name: Fix Private Challenge test isolation

on:
  push:
    branches:
      - feat/site-admin-powerlift-20260918

permissions:
  contents: write

jobs:
  fix-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/site-admin-powerlift-20260918
          fetch-depth: 0
      - name: Isolate IGA mock calls per test
        shell: bash
        run: |
          node -e "const fs=require('fs');const p='api/__tests__/private-challenge-staking-live-contract.test.ts';let s=fs.readFileSync(p,'utf8');const o=\"  (computePrivateChallengeIGAForWindow as jest.Mock).mockResolvedValue({ average: 0, weeks: [] });\";const n=\"  (computePrivateChallengeIGAForWindow as jest.Mock).mockClear();\\n  (computePrivateChallengeIGAForWindow as jest.Mock).mockResolvedValue({ average: 0, weeks: [] });\";if(!s.includes(o))process.exit(2);fs.writeFileSync(p,s.replace(o,n));"
          git diff --check
          git add api/__tests__/private-challenge-staking-live-contract.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: isolate private challenge IGA mock calls"
          git push origin HEAD:feat/site-admin-powerlift-20260918
