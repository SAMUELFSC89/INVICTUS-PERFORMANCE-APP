name: Apply Free PRO AI Split
on:
  push:
    branches: [feat/free-pro-ai-split]
    paths: ['.github/workflows/apply-free-pro-ai-split.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/free-pro-ai-split
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply gated AI and health changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'pattern not found in {path}: {old[:100]}')
              p.write_text(s.replace(old,new,1))

          replace('api/_lib/cardio-objective-ai.ts',
          "export async function explainObjectiveDecision(userId: string, journey: Journey, review: Review): Promise<ObjectiveExplanation> {\n  const fallback = { text: review.reason, source: 'deterministic' as const, model: null };\n  const apiKey = getAiApiKey();",
          "export async function explainObjectiveDecision(userId: string, journey: Journey, review: Review, options: { allowAi?: boolean } = {}): Promise<ObjectiveExplanation> {\n  const fallback = { text: review.reason, source: 'deterministic' as const, model: null };\n  // FREE never reaches Gemini: the deterministic engine already made the decision and\n  // its reason is a complete zero-token explanation. PRO may receive a richer wording.\n  if (options.allowAi === false) return fallback;\n  const apiKey = getAiApiKey();")

          replace('api/_handlers/cardio-objective.ts',
          "import { explainObjectiveDecision } from '../_lib/cardio-objective-ai.js';",
          "import { explainObjectiveDecision } from '../_lib/cardio-objective-ai.js';\nimport { isProUser } from '../_lib/entitlement.js';")
          replace('api/_handlers/cardio-objective.ts',
          "return res.json({ ...view, explanation: await explainObjectiveDecision(auth.uid, view.journey, latest) });",
          "return res.json({ ...view, explanation: await explainObjectiveDecision(auth.uid, view.journey, latest, { allowAi: isProUser(user) }) });")

          replace('api/_handlers/health-summary.ts',
          "import { buildConsolidatedDailyActiveCalories } from '../_lib/daily-active-energy.js';",
          "import { buildConsolidatedDailyActiveCalories } from '../_lib/daily-active-energy.js';\nimport { isProUser } from '../_lib/entitlement.js';")
          replace('api/_handlers/health-summary.ts',
          "  if (req.method !== 'GET') return res.status(405).json({ error: 'Método não permitido.' });\n  const timeZone = typeof req.query?.timeZone === 'string' ? req.query.timeZone : 'UTC';",
          "  if (req.method !== 'GET') return res.status(405).json({ error: 'Método não permitido.' });\n  const userSnap = await db.collection('users').doc(auth.uid).get();\n  if (!userSnap.exists || !isProUser(userSnap.data())) {\n    return res.status(403).json({ error: 'Dados de saúde são um benefício exclusivo do plano PRO.', code: 'PRO_REQUIRED' });\n  }\n  const timeZone = typeof req.query?.timeZone === 'string' ? req.query.timeZone : 'UTC';")

          Path('src/components/ProFeatureGate.tsx').write_text("""import type { ReactNode } from 'react';
import { Brain, Crown, HeartPulse, ShieldCheck } from 'lucide-react';
import { useLocation, useNavigate } from 'react-router-dom';
import { useUser } from '../UserContext';
import { hasActiveProEntitlement } from '../lib/proEntitlement';
import './ProFeatureGate.css';

type Feature = 'health' | 'ai';
const copy: Record<Feature, { eyebrow: string; title: string; description: string; benefits: string[] }> = {
  health: {
    eyebrow: 'SAÚDE PRO',
    title: 'SEUS DADOS. SUA PERFORMANCE.',
    description: 'Transforme dados de saúde e sensores em uma visão completa da sua evolução.',
    benefits: ['Métricas biométricas e tendências', 'Sono, recuperação e frequência cardíaca', 'Relatórios completos de evolução']
  },
  ai: {
    eyebrow: 'INVICTUS IA',
    title: 'INTELIGÊNCIA PERSONALIZADA.',
    description: 'Converse com a Invictus IA e receba análises personalizadas a partir da sua jornada.',
    benefits: ['Chat e análises por IA', 'Memória individual da sua evolução', 'Insights e recomendações personalizadas']
  }
};

export function ProFeatureGate({ feature, children }: { feature: Feature; children: ReactNode }) {
  const { user } = useUser();
  const navigate = useNavigate();
  const location = useLocation();
  if (hasActiveProEntitlement(user) || user?.role === 'admin') return <>{children}</>;
  const content = copy[feature];
  const Icon = feature === 'health' ? HeartPulse : Brain;
  return <main className="pro-feature-gate">
    <section className="pro-feature-gate-card">
      <span className="pro-feature-gate-icon"><Icon /></span>
      <small>{content.eyebrow}</small>
      <h1>{content.title}</h1>
      <p>{content.description}</p>
      <div className="pro-feature-gate-benefits">{content.benefits.map(item => <span key={item}><ShieldCheck />{item}</span>)}</div>
      <button onClick={() => navigate('/profile/preferences/subscriptions', { state: { returnTo: `${location.pathname}${location.search}${location.hash}` } })}><Crown /> DESBLOQUEAR COM PRO</button>
      <em>Plano PRO · assinatura gerenciada pela loja do seu dispositivo</em>
    </section>
  </main>;
}
""")
          Path('src/components/ProFeatureGate.css').write_text(""".pro-feature-gate{min-height:100%;display:grid;place-items:center;padding:28px 16px 110px;color:#f5f3ed;background:radial-gradient(circle at 80% 8%,rgba(242,181,22,.10),transparent 30%),#030303}.pro-feature-gate-card{width:min(100%,480px);display:grid;gap:14px;padding:24px;border:1px solid rgba(242,181,22,.34);border-radius:16px;background:linear-gradient(145deg,#12110d,#070707);box-shadow:0 24px 70px rgba(0,0,0,.38)}.pro-feature-gate-icon{display:grid;width:58px;height:58px;place-items:center;border:1px solid rgba(242,181,22,.45);border-radius:50%;color:#f2b516;background:#151107}.pro-feature-gate-icon svg{width:27px}.pro-feature-gate-card>small{color:#f2b516;font-size:11px;font-weight:900;letter-spacing:.16em}.pro-feature-gate-card h1{margin:0;font-family:'Bebas Neue',sans-serif;font-size:34px;font-weight:400;line-height:1}.pro-feature-gate-card>p{margin:0;color:#c7c3ba;font-size:14px;line-height:1.55}.pro-feature-gate-benefits{display:grid;gap:9px;padding:14px 0}.pro-feature-gate-benefits span{display:flex;align-items:center;gap:8px;color:#e2ddd2;font-size:13px}.pro-feature-gate-benefits svg{width:17px;color:#f2b516}.pro-feature-gate-card>button{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border:0;border-radius:9px;color:#171004;background:linear-gradient(100deg,#ffc43a,#e99e00);font-size:13px;font-weight:900}.pro-feature-gate-card>button svg{width:18px}.pro-feature-gate-card>em{color:#88837a;font-size:10px;font-style:normal;text-align:center}
""")

          replace('src/App.tsx',
          "import { MobileBridge } from './components/MobileBridge';",
          "import { MobileBridge } from './components/MobileBridge';\nimport { ProFeatureGate } from './components/ProFeatureGate';")
          replace('src/App.tsx', "<Route path=\"/ai\" element={<InvictusAI />} />", "<Route path=\"/ai\" element={<ProFeatureGate feature=\"ai\"><InvictusAI /></ProFeatureGate>} />")
          replace('src/App.tsx', "<Route path=\"/health\" element={<Health />} />", "<Route path=\"/health\" element={<ProFeatureGate feature=\"health\"><Health /></ProFeatureGate>} />")
          replace('src/App.tsx', "<Route path=\"/health/report\" element={<HealthReport />} />", "<Route path=\"/health/report\" element={<ProFeatureGate feature=\"health\"><HealthReport /></ProFeatureGate>} />")
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/apply-free-pro-ai-split.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: separate FREE deterministic flows from PRO AI"
          git push origin HEAD:feat/free-pro-ai-split
