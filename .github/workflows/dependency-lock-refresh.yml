name: Dependency Lock Refresh

on:
  push:
    branches:
      - fix/dependency-critical-security-20260916

permissions:
  contents: write

jobs:
  refresh-lock:
    if: ${{ !contains(github.event.head_commit.message, '[lock-refresh]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/dependency-critical-security-20260916

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Regenerate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --audit=false

      - name: Verify frozen install
        run: npm ci --ignore-scripts

      - name: Verify critical dependency versions and production audit
        shell: bash
        run: |
          node -e "for (const p of ['protobufjs','tar','websocket-driver']) console.log(p, require(p + '/package.json').version)"
          npm audit --omit=dev --audit-level=critical

      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Refresh dependency lockfile [lock-refresh]'
          git push
