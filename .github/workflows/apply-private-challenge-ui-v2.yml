name: Materialize approved Private Challenge Coins UI

on:
  push:
    branches:
      - feat/site-admin-powerlift-20260918

permissions:
  contents: write

jobs:
  apply-ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v5
        with:
          ref: feat/site-admin-powerlift-20260918
          fetch-depth: 0

      - name: Materialize approved client diff
        shell: bash
        run: |
          if grep -q "APOSTAR INVICTUS COINS" src/components/PrivateChallengesTab.tsx; then
            echo "Approved UI already materialized."
            exit 0
          fi
          git show origin/main:0002-feat-challenges-add-Invictus-Coins-wagering-to-priva.patch > /tmp/private-challenges.patch
          git apply --3way --include=src/components/PrivateChallengesTab.tsx /tmp/private-challenges.patch
          git diff --check
          grep -q "APOSTAR INVICTUS COINS" src/components/PrivateChallengesTab.tsx
          grep -q "stakeAmount" src/components/PrivateChallengesTab.tsx
          git add src/components/PrivateChallengesTab.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: materialize approved private challenge Coins UI"
          git push origin HEAD:feat/site-admin-powerlift-20260918
