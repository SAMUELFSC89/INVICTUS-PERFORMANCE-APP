name: Apply championships ranking round

on:
  push:
    branches:
      - feat/championships-ranking-round

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/championships-ranking-round
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply backend and route patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          handler_path = Path('api/_handlers/community-championship.ts')
          handler = handler_path.read_text()
          handler = replace_once(handler,
              "  if (req.method === 'GET') {\n    const [own, count, championship] = await Promise.all([\n      ref.get(),\n      db.collection('community_championship_enrollments').where('eventId', '==', EVENT_ID).where('status', '==', 'active').count().get(),\n      getCommunityGymChampionshipStatus(auth.uid),\n    ]);",
              "  if (req.method === 'GET') {\n    const rawPeriod = String(req.query.period || 'weekly');\n    const period = rawPeriod === 'monthly' || rawPeriod === 'all' ? rawPeriod : 'weekly';\n    const [own, count, championship] = await Promise.all([\n      ref.get(),\n      db.collection('community_championship_enrollments').where('eventId', '==', EVENT_ID).where('status', '==', 'active').count().get(),\n      getCommunityGymChampionshipStatus(auth.uid, new Date(), period),\n    ]);",
              'community handler period')
          handler_path.write_text(handler)

          scoring_path = Path('api/_lib/championship-scoring-service.ts')
          scoring = scoring_path.read_text()
          pattern = re.compile(r"export async function getCommunityGymChampionshipStatus\(userId: string, now = new Date\(\)\) \{.*?\n\}\n\nexport async function resolveGymChampionshipReview", re.S)
          replacement = '''type CommunityRankingPeriod = 'weekly' | 'monthly' | 'all';

          function communityRankingPeriodStart(period: CommunityRankingPeriod, now: Date): Date | null {
            if (period === 'all') return null;
            if (period === 'monthly') return new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), 1));
            const start = new Date(now);
            const daysSinceMonday = (start.getUTCDay() + 6) % 7;
            start.setUTCDate(start.getUTCDate() - daysSinceMonday);
            start.setUTCHours(0, 0, 0, 0);
            return start;
          }

          export async function getCommunityGymChampionshipStatus(
            userId: string,
            now = new Date(),
            period: CommunityRankingPeriod = 'weekly',
          ) {
            const [userSnap, configSnap] = await Promise.all([
              db.collection('users').doc(userId).get(),
              db.collection('gym_championship_config').doc('global').get(),
            ]);
            const user = userSnap.data() || {};
            const config = configSnap.data() || {};
            const gymId = String(user.gymId || user.academyId || 'community_global');
            const cycleKey = communityCycleKey(now);
            const cutoff = communityRankingPeriodStart(period, now);
            const snap = await db.collection('gym_championship_scores')
              .where('eventId', '==', COMMUNITY_EVENT_ID)
              .limit(5000)
              .get();
            const totals = new Map<string, { userId: string; userName: string; score: number; validActivities: number }>();
            snap.forEach(doc => {
              const data: any = doc.data();
              if (data.gymId !== gymId || data.validationStatus !== 'VALIDATED') return;
              if (cutoff) {
                const createdAt = data.createdAt?.toDate ? data.createdAt.toDate() : new Date(data.createdAt || 0);
                if (!Number.isFinite(createdAt.getTime()) || createdAt < cutoff || createdAt > now) return;
              }
              const item = totals.get(data.userId) || { userId: data.userId, userName: data.userName || 'Atleta Invictus', score: 0, validActivities: 0 };
              item.score += Math.max(0, Number(data.score) || 0);
              item.validActivities += 1;
              totals.set(data.userId, item);
            });
            const ranked = [...totals.values()]
              .sort((a, b) => b.score - a.score || a.userName.localeCompare(b.userName, 'pt-BR', { sensitivity: 'base' }) || a.userId.localeCompare(b.userId))
              .map((item, index) => ({ ...item, rank: index + 1 }));
            const visible = ranked.slice(0, 100);
            const profileRefs = visible.map((item) => db.collection('users').doc(item.userId));
            const profileSnaps = profileRefs.length ? await db.getAll(...profileRefs) : [];
            const profileByUid = new Map(profileSnaps.map((snap) => [snap.id, snap.data() || {}]));
            const leaderboard = visible.map((item) => ({
              ...item,
              photoURL: String(profileByUid.get(item.userId)?.photoURL || (item.userId === userId ? user.photoURL || '' : '')),
            }));
            const rankIndex = ranked.findIndex(item => item.userId === userId);
            const resultSnap = await db.collection('gym_championship_results').doc(`${cycleKey}_${gymId}_${userId}`).get();
            return {
              cycleKey, period, gymId, gymName: String(user.gymName || 'Comunidade Invictus'),
              rank: rankIndex >= 0 ? rankIndex + 1 : null,
              score: rankIndex >= 0 ? ranked[rankIndex].score : 0,
              validActivities: rankIndex >= 0 ? ranked[rankIndex].validActivities : 0,
              leaderboard,
              resultStatus: resultSnap.data()?.status || 'OPEN',
              prizes: {
                1: Math.max(0, Number(config.top1Prize) || 2500),
                2: Math.max(0, Number(config.top2Prize) || 1500),
                3: Math.max(0, Number(config.top3Prize) || 1000),
                participation: Math.max(0, Number(config.participationPrize) || 50),
              },
            };
          }

          export async function resolveGymChampionshipReview'''
          scoring, count = pattern.subn(replacement, scoring, count=1)
          if count != 1:
              raise SystemExit(f'community scoring replacement: expected 1 match, found {count}')
          scoring_path.write_text(scoring)

          app_path = Path('src/App.tsx')
          app = app_path.read_text()
          app = replace_once(app,
              "const CommunityChampionship = lazyNamed(() => import('./pages/championships/CommunityChampionship'), 'CommunityChampionship');\nconst ChampionshipPreview = lazyNamed(() => import('./pages/championships/ChampionshipPreview'), 'ChampionshipPreview');",
              "const CommunityChampionship = lazyNamed(() => import('./pages/championships/CommunityChampionship'), 'CommunityChampionship');\nconst CommunityRanking = lazyNamed(() => import('./pages/championships/CommunityRanking'), 'CommunityRanking');\nconst ChampionshipPreview = lazyNamed(() => import('./pages/championships/ChampionshipPreview'), 'ChampionshipPreview');",
              'app lazy ranking')
          app = replace_once(app,
              '<Route path="/rankings" element={<Navigate to="/championships?section=ranking" replace />} />',
              '<Route path="/rankings" element={<Navigate to="/championships" replace />} />',
              'legacy ranking route')
          app = replace_once(app,
              '<Route path="/championships/community" element={<CommunityChampionship />} />\n                <Route path="/championships/preview/musculacao"',
              '<Route path="/championships/community" element={<CommunityChampionship />} />\n                <Route path="/championships/community/ranking" element={<CommunityRanking />} />\n                <Route path="/championships/preview/musculacao"',
              'community ranking route')
          app_path.write_text(app)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Focused tests
        run: npx jest src/tests/championshipsRankingRound.test.ts api/__tests__/academy-ranking-contract.test.ts --runInBand

      - name: Production build
        run: npm run build

      - name: Commit validated implementation
        shell: bash
        run: |
          rm -f .github/workflows/apply-championships-ranking-round.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/_handlers/community-championship.ts api/_lib/championship-scoring-service.ts src/App.tsx .github/workflows/apply-championships-ranking-round.yml
          git commit -m "feat: connect participating championship to dedicated ranking"
          git push origin HEAD:feat/championships-ranking-round
