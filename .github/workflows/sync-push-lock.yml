name: Sync push notifications lockfile

on:
  push:
    branches:
      - fix/ci-baseline-security-audit-20260916

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[lock-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v5
        with:
          ref: fix/ci-baseline-security-audit-20260916
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Regenerate package lock for supported foreground push options
        run: npm install '@capacitor/push-notifications@^8.1.2' --save --package-lock-only --ignore-scripts

      - name: Commit generated manifest and lockfile
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No lockfile changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'Align push notifications plugin and lockfile [lock-sync]'
          git push origin HEAD:fix/ci-baseline-security-audit-20260916
