name: Sync CI baseline audit fixes

on:
  push:
    branches:
      - fix/ci-baseline-security-audit-20260916

permissions:
  contents: write

jobs:
  sync-baseline:
    if: ${{ !contains(github.event.head_commit.message, '[baseline-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v5
        with:
          ref: fix/ci-baseline-security-audit-20260916
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Apply audited baseline fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Expected audited snippet not found in {path}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'api/__tests__/training-plans-catalog.test.ts',
              "jest.mock('../_lib/entitlement', () => ({ isProUser: () => true }));",
              "jest.mock('../_lib/ai-quota', () => ({\n  consumeAiQuota: jest.fn(async () => ({ allowed: true, retryAfterSeconds: 0 })),\n}));\njest.mock('../_lib/entitlement', () => ({ isProUser: () => true }));"
          )

          replace_once(
              'api/__tests__/ai-memory-training-guardrails.test.ts',
              "expect(performance).toContain('MÉTRICAS DE PERFORMANCE E HISTÓRICO DE TREINOS');",
              "expect(performance).toContain('MÉTRICAS DE PERFORMANCE EXIBIDAS NO CLIENTE (CONTEXTO CONVERSACIONAL, NÃO AUTORIDADE DE SCORE/PREMIAÇÃO)');"
          )

          replace_once(
              'src/pages/ProfileNew.tsx',
              'type="file" accept="image/*" hidden onChange={upload}',
              'type="file" accept="image/jpeg,image/png,image/webp" hidden onChange={upload}'
          )

          replace_once(
              'ios/App/App/Info.plist',
              '\t<key>NSHealthUpdateUsageDescription</key>\n\t<string>O Invictus solicita sua permissão para registrar no app Saúde dados de atividades e treinos iniciados ou concluídos no Invictus, quando esse recurso estiver disponível, para manter seu histórico de exercícios sincronizado. Nenhum dado é gravado sem sua autorização.</string>\n',
              ''
          )

          replace_once(
              'api/__tests__/observability-test-isolation.test.ts',
              "import { db } from '../_lib/common.js';\nimport { incrementMetric, logEvent, memoryCache, triggerAlert } from '../_lib/observability.js';",
              "const mockCollection = jest.fn(() => { throw new Error('Firestore must not be touched in test mode'); });\n\njest.mock('../_lib/common.js', () => ({ db: { collection: mockCollection } }));\n\nimport { incrementMetric, logEvent, memoryCache, triggerAlert } from '../_lib/observability.js';"
          )
          replace_once(
              'api/__tests__/observability-test-isolation.test.ts',
              "    const collectionSpy = jest.spyOn(db, 'collection').mockImplementation(() => {\n      throw new Error('Firestore must not be touched in test mode');\n    });\n\n",
              ''
          )
          replace_once(
              'api/__tests__/observability-test-isolation.test.ts',
              '    expect(collectionSpy).not.toHaveBeenCalled();',
              '    expect(mockCollection).not.toHaveBeenCalled();'
          )

          replace_once(
              'api/__tests__/iga-fraud-stress.test.ts',
              "      securityDecision: 'APPROVED',\n    };\n  }\n  if (kind === 'personal') {",
              "      securityDecision: 'APPROVED',\n      competitionEvidenceStatus: 'trusted_server_source',\n      competitionEvidenceMetrics: {\n        activityType: modality,\n        cardioType: modality === 'cardio' ? 'running' : null,\n        isIndoorCardio: false,\n        startTime: base.startTime,\n        endTime: base.endTime,\n        durationMinutes: base.duration,\n        distanceKm: modality === 'cardio' ? 5 : null,\n        avgHeartRate: 145,\n        maxHeartRate: 170,\n        calories: 400,\n      },\n    };\n  }\n  if (kind === 'personal') {"
          )
          PY

      - name: Regenerate package lock for supported foreground push options
        run: npm install '@capacitor/push-notifications@^8.1.2' --save --package-lock-only --ignore-scripts

      - name: Commit audited baseline changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No baseline changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json \
            api/__tests__/training-plans-catalog.test.ts \
            api/__tests__/ai-memory-training-guardrails.test.ts \
            api/__tests__/observability-test-isolation.test.ts \
            api/__tests__/iga-fraud-stress.test.ts \
            src/pages/ProfileNew.tsx ios/App/App/Info.plist
          git commit -m 'Restore CI baseline after security hardening [baseline-sync]'
          git push origin HEAD:fix/ci-baseline-security-audit-20260916
