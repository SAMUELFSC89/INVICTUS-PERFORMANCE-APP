name: Apply share card reference fidelity

on:
  push:
    branches:
      - feat/share-card-reference-fidelity

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/share-card-reference-fidelity
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply approved-reference patch
        run: |
          python3 scripts/apply_share_card_reference_fidelity.py
          python3 scripts/fix_share_card_native_contract.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Focused share card tests
        run: npx jest src/tests/shareCardNativeContract.test.ts src/tests/cardioShareDirectFlow.test.ts src/tests/shareCardReferenceFidelity.test.ts --runInBand

      - name: Production build
        run: npm run build

      - name: Commit implementation
        shell: bash
        run: |
          rm -f scripts/apply_share_card_reference_fidelity.py scripts/fix_share_card_native_contract.py .github/workflows/apply-share-card-reference-fidelity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: align share cards with approved references"
          git push origin HEAD:feat/share-card-reference-fidelity
