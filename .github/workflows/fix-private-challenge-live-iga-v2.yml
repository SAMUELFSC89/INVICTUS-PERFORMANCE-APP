name: Run Private Challenge live IGA migration

on:
  push:
    branches:
      - feat/site-admin-powerlift-20260918

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/site-admin-powerlift-20260918
          fetch-depth: 0
      - name: Apply migration
        run: python scripts/fix-private-challenge-live-iga.py
      - name: Validate and commit
        run: |
          git diff --check
          grep -q "scoringMode: isLegacyMoneyChallenge ? 'LEGACY' : 'IGA'" api/_handlers/private-challenges.ts
          grep -q "listagem ativa ordena participantes pelo IGA da janela" api/__tests__/private-challenge-staking-live-contract.test.ts
          git add api/_handlers/private-challenges.ts src/components/PrivateChallengesTab.tsx api/__tests__/private-challenge-staking-live-contract.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: use IGA for live private challenge ranking"
          git push origin HEAD:feat/site-admin-powerlift-20260918
