name: High Severity Dependency Refresh

on:
  push:
    branches:
      - fix/dependency-high-security-20260916

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/dependency-high-security-20260916

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Apply non-breaking production audit fixes to lockfile only
        run: npm audit fix --package-lock-only --omit=dev --ignore-scripts

      - name: Ensure package manifest was not rewritten
        run: git diff --exit-code -- package.json

      - name: Verify frozen install
        run: npm ci --ignore-scripts

      - name: Report remaining production vulnerabilities
        shell: bash
        run: |
          npm audit --omit=dev --json > audit-prod.json || true
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('audit-prod.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities || {};
          const remaining = Object.entries(report.vulnerabilities || {})
            .filter(([, v]) => v.severity === 'critical' || v.severity === 'high')
            .map(([name, v]) => `${v.severity}:${name}`);
          console.log('PRODUCTION_AUDIT_COUNTS', JSON.stringify(counts));
          console.log('REMAINING_HIGH_OR_CRITICAL', remaining.join(','));
          if ((counts.critical || 0) !== 0) process.exit(1);
          NODE

      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Refresh high-severity dependency lockfile [lock-refresh]'
          git push
