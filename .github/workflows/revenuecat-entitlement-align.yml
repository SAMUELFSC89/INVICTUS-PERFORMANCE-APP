name: RevenueCat Entitlement Align

on:
  push:
    branches:
      - fix/revenuecat-entitlement-align
    paths:
      - .github/workflows/revenuecat-entitlement-align.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/revenuecat-entitlement-align
      - name: Align RevenueCat entitlement IDs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('src/lib/revenuecat-core.ts'),
              Path('api/_lib/payments-service.ts'),
          ]
          old = "export const PERFORMANCE_ENTITLEMENT_ID = 'performance';"
          new = "export const PERFORMANCE_ENTITLEMENT_ID = 'invictus_performance_pro';"
          for path in files:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 entitlement constant, found {count}')
              path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify alignment
        shell: bash
        run: |
          set -euo pipefail
          grep -F "export const PERFORMANCE_ENTITLEMENT_ID = 'invictus_performance_pro';" src/lib/revenuecat-core.ts
          grep -F "export const PERFORMANCE_ENTITLEMENT_ID = 'invictus_performance_pro';" api/_lib/payments-service.ts
          if grep -R -n --exclude='revenuecat-entitlement-align.yml' "PERFORMANCE_ENTITLEMENT_ID = 'performance'" src api; then
            echo 'Legacy RevenueCat entitlement constant still present.' >&2
            exit 1
          fi
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/revenuecat-core.ts api/_lib/payments-service.ts
          git commit -m 'fix: align RevenueCat Pro entitlement'
          git push origin HEAD:fix/revenuecat-entitlement-align
