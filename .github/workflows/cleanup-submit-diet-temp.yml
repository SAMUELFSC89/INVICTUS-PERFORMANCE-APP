name: Temporary submitDiet cleanup

on:
  push:
    branches:
      - fix/powerlift-remove-secondary-bottom-nav-20260919
    paths:
      - .github/workflows/cleanup-submit-diet-temp.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: fix/powerlift-remove-secondary-bottom-nav-20260919
          fetch-depth: 0

      - name: Remove legacy submitDiet method only
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/services/activityService.ts')
          source = path.read_text(encoding='utf-8')
          start_marker = '\n  async submitDiet(photoBase64: string): Promise<{ workout: Workout; validation: any }> {'
          end_marker = '\n  cancelSession() {'
          start = source.find(start_marker)
          end = source.find(end_marker, start + 1)
          if start == -1:
              raise SystemExit('submitDiet marker not found')
          if end == -1:
              raise SystemExit('cancelSession marker not found after submitDiet')
          cleaned = source[:start] + '\n' + source[end:]
          if 'async submitDiet(' in cleaned:
              raise SystemExit('submitDiet still present after cleanup')
          if cleaned.count('cancelSession() {') != source.count('cancelSession() {'):
              raise SystemExit('Unexpected cancelSession change')
          path.write_text(cleaned, encoding='utf-8')

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet -- src/services/activityService.ts; then
            echo "No cleanup needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/activityService.ts
          git commit -m "refactor: remover submitDiet legado"
          git push origin HEAD:fix/powerlift-remove-secondary-bottom-nav-20260919
