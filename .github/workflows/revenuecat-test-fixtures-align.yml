name: RevenueCat Test Fixtures Align

on:
  push:
    branches:
      - fix/revenuecat-entitlement-align
    paths:
      - .github/workflows/revenuecat-test-fixtures-align.yml

permissions:
  contents: write

jobs:
  align-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/revenuecat-entitlement-align
      - name: Align RevenueCat entitlement fixtures only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # Client test helper: change only the key inside customerInfo().
          path = Path('src/lib/revenuecat-core.test.ts')
          text = path.read_text()
          old = "      active: {\n        performance: {\n"
          new = "      active: {\n        invictus_performance_pro: {\n"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'{path}: expected exactly 1 client entitlement fixture, found {count}')
          path.write_text(text.replace(old, new, 1))

          # Backend RevenueCat REST mocks: change only keys nested immediately under
          # subscriber.entitlements; preserve every internal plan/tier `performance` field.
          path = Path('api/__tests__/payments-service.test.ts')
          text = path.read_text()
          old = "          entitlements: {\n            performance: {\n"
          new = "          entitlements: {\n            invictus_performance_pro: {\n"
          count = text.count(old)
          if count < 1:
              raise SystemExit(f'{path}: no RevenueCat subscriber entitlement fixtures found')
          path.write_text(text.replace(old, new))
          print(f'Updated {count} backend RevenueCat entitlement fixture(s).')
          PY
      - name: Verify no legacy RevenueCat fixture key remains in targeted contexts
        shell: bash
        run: |
          set -euo pipefail
          grep -F "invictus_performance_pro: {" src/lib/revenuecat-core.test.ts
          grep -F "invictus_performance_pro: {" api/__tests__/payments-service.test.ts
          python - <<'PY'
          from pathlib import Path
          client = Path('src/lib/revenuecat-core.test.ts').read_text()
          backend = Path('api/__tests__/payments-service.test.ts').read_text()
          if "      active: {\n        performance: {\n" in client:
              raise SystemExit('Legacy client entitlement fixture remains')
          if "          entitlements: {\n            performance: {\n" in backend:
              raise SystemExit('Legacy backend RevenueCat entitlement fixture remains')
          PY
      - name: Commit test fixture alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/revenuecat-core.test.ts api/__tests__/payments-service.test.ts
          git commit -m 'test: align RevenueCat entitlement fixtures'
          git push origin HEAD:fix/revenuecat-entitlement-align
