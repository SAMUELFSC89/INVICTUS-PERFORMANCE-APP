workflows:
  android-debug:
    name: Android Debug APK
    max_build_duration: 60
    environment:
      node: 22
      java: 21
    scripts:
      - name: Install npm dependencies
        script: |
          npm install --no-audit --no-fund
      - name: Build web app (Vite)
        script: |
          npx vite build
      - name: Sync Capacitor Android project
        script: |
          npx cap sync android
      - name: Repair Gradle wrapper jar (corrupted in repo)
        script: |
          curl -sSL -o android/gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradle/wrapper/gradle-wrapper.jar
      - name: Build Android debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk

  # ---------------------------------------------------------------------------
  # #219: build iOS -> TestFlight.
  #
  # A pasta ios/ NAO esta commitada (diferente de android/), entao este workflow
  # a gera do zero a cada build com "npx cap add ios" na maquina macOS do
  # Codemagic -- permitindo publicar sem um Mac local. Como e recriada a cada
  # build, toda customizacao nativa precisa ser injetada por script aqui.
  #
  # Xcode 26 e obrigatorio: desde 28/04/2026 a Apple rejeita uploads com SDK
  # anterior ao iOS 26 (ITMS-90725).
  # ---------------------------------------------------------------------------
  ios-testflight:
    name: iOS TestFlight (INVICTUS)
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: INVICTUS_ASC_KEY
    environment:
      node: 22
      xcode: 26
      vars:
        BUNDLE_ID: "com.desafiosemdesculpa.app"
        XCODE_SCHEME: "App"
    scripts:
      - name: Instalar dependencias npm
        script: |
          npm install --no-audit --no-fund

      - name: Build do app web (Vite)
        script: |
          npx vite build

      - name: Criar projeto iOS nativo (se ainda nao existir)
        script: |
          set -e
          if [ ! -d "ios" ]; then
            echo "Pasta ios/ nao encontrada -- gerando projeto nativo com Capacitor..."
            npx cap add ios
          else
            echo "Pasta ios/ ja existe no repositorio -- apenas sincronizando."
          fi

      - name: Sincronizar web assets e plugins no projeto iOS
        script: |
          set -e
          npx cap sync ios

      - name: Diagnostico do projeto iOS gerado
        script: |
          # Passo puramente informativo (nunca derruba o build): serve para
          # descobrir a estrutura real que o Capacitor 8 + SPM produz, ja que o
          # build anterior falhou com "Failed to show build settings".
          echo "=== conteudo de ios/App ==="
          ls -la ios/App/ || true
          echo "=== existe workspace? ==="
          ls -la ios/App/App.xcworkspace 2>/dev/null || echo "SEM App.xcworkspace"
          echo "=== schemes e targets do projeto ==="
          xcodebuild -list -project ios/App/App.xcodeproj 2>&1 | head -40 || true
          echo "=== erro detalhado do showBuildSettings ==="
          xcodebuild -project ios/App/App.xcodeproj -scheme App -showBuildSettings 2>&1 | head -40 || true

      - name: Injetar permissoes de privacidade no Info.plist
        script: |
          set -e
          PLIST="ios/App/App/Info.plist"

          set_string () {
            /usr/libexec/PlistBuddy -c "Delete :$1" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$PLIST"
          }

          # GPS -- cardio ao ar livre, check-in presencial e antifraude.
          set_string "NSLocationWhenInUseUsageDescription" "O INVICTUS usa sua localizacao para registrar a rota das atividades de cardio e confirmar seu check-in presencial na academia."
          set_string "NSLocationAlwaysAndWhenInUseUsageDescription" "O INVICTUS usa sua localizacao durante a atividade para medir distancia e ritmo com precisao, mesmo com a tela desligada."

          # Sensores de movimento -- o antifraude exige acelerometro/giroscopio.
          set_string "NSMotionUsageDescription" "O INVICTUS le os sensores de movimento do aparelho para validar que a atividade foi realmente executada por voce."

          # HealthKit (plugin capacitor-health).
          set_string "NSHealthShareUsageDescription" "O INVICTUS le dados de saude como frequencia cardiaca, passos e calorias para calcular sua pontuacao com mais precisao."
          set_string "NSHealthUpdateUsageDescription" "O INVICTUS registra suas atividades concluidas no app Saude do iPhone."

          # Camera / fotos -- comprovantes de treino e video do Power Lift.
          set_string "NSCameraUsageDescription" "O INVICTUS usa a camera para registrar comprovantes de treino e os videos de homologacao do Power Lift."
          set_string "NSMicrophoneUsageDescription" "O INVICTUS grava audio junto com o video de homologacao do Power Lift."
          set_string "NSPhotoLibraryUsageDescription" "O INVICTUS acessa suas fotos para anexar comprovantes de atividade."
          set_string "NSPhotoLibraryAddUsageDescription" "O INVICTUS salva na sua galeria o card de compartilhamento das atividades."

          # Background: rastreio de rota durante o cardio + push.
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string location" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:1 string remote-notification" "$PLIST"

          # Declaracao de criptografia (so HTTPS/TLS padrao). Sem isso o build
          # sobe mas trava em "Missing Compliance".
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"

      - name: Configurar entitlements (HealthKit + Push)
        script: |
          set -e
          ENT="ios/App/App/App.entitlements"
          rm -f "$ENT"
          /usr/libexec/PlistBuddy -c "Save" "$ENT"
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.healthkit bool true" "$ENT"
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.healthkit.access array" "$ENT"
          /usr/libexec/PlistBuddy -c "Add :aps-environment string production" "$ENT"

      - name: Instalar dependencias nativas (CocoaPods so se houver Podfile)
        script: |
          set -e
          # Capacitor 8 usa Swift Package Manager quando todos os plugins tem
          # Package.swift -- nesse caso nao ha Podfile e "pod install" quebraria.
          if [ -f "ios/App/Podfile" ]; then
            cd ios/App && pod install --repo-update
          else
            echo "Sem Podfile: projeto usa Swift Package Manager."
          fi

      - name: Buscar certificados e perfis da conta Apple
        script: |
          set -e
          # Criar um certificado de distribuicao exige um CSR, que exige uma
          # chave privada -- sem ela o comando falha com "Cannot save Signing
          # Certificates without certificate private key".
          #
          # Preferimos a chave persistida em CERTIFICATE_PRIVATE_KEY para que
          # todos os builds reusem o MESMO certificado. Gerar chave nova a cada
          # build criaria um certificado novo toda vez, e a Apple limita a
          # poucos certificados de distribuicao por conta.
          if [ -n "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "Usando chave privada persistida (CERTIFICATE_PRIVATE_KEY)."
            app-store-connect fetch-signing-files "$BUNDLE_ID" \
              --type IOS_APP_STORE \
              --certificate-key="@env:CERTIFICATE_PRIVATE_KEY" \
              --create
          else
            echo "AVISO: CERTIFICATE_PRIVATE_KEY nao configurada -- gerando chave"
            echo "temporaria. Isso cria um certificado NOVO a cada build."
            ssh-keygen -t rsa -b 2048 -m PEM -f /tmp/signing_key -q -N ""
            app-store-connect fetch-signing-files "$BUNDLE_ID" \
              --type IOS_APP_STORE \
              --certificate-key=@file:/tmp/signing_key \
              --create
          fi
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Definir numero do build
        script: |
          set -e
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Resolver dependencias do Swift Package Manager
        script: |
          # Com SPM o xcodebuild precisa baixar/resolver os pacotes antes de
          # conseguir ler as build settings -- sem isso o build falha com
          # "Failed to show build settings".
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme "$XCODE_SCHEME" 2>&1 | tail -30 || true

      - name: Compilar e gerar o .ipa
        script: |
          set -e
          # Com CocoaPods existe App.xcworkspace; com Swift Package Manager o
          # Capacitor pode gerar apenas App.xcodeproj. Detecta qual usar.
          if [ -d "ios/App/App.xcworkspace" ]; then
            echo "Compilando via workspace."
            xcode-project build-ipa --workspace "ios/App/App.xcworkspace" --scheme "$XCODE_SCHEME"
          else
            echo "Compilando via project (Swift Package Manager)."
            xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "$XCODE_SCHEME"
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - samuelfsc89@gmail.com
        notify:
          success: true
          failure: true
