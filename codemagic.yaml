workflows:
  android-debug:
    name: Android Debug APK
    max_build_duration: 60
    environment:
      node: 22
    scripts:
      - name: Install npm dependencies
        script: |
          npm install --no-audit --no-fund
      - name: Build web app (Vite)
        script: |
          npx vite build
      - name: Sync Capacitor Android project
        script: |
          npx cap sync android
      - name: Repair Gradle wrapper jar (corrupted in repo)
        script: |
          curl -sSL -o android/gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradle/wrapper/gradle-wrapper.jar
      - name: Build Android debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
